<div class="dimention p-2">
    <div class="d-flex align-items-center justify-content-between">
        <h5 class="text-center mb-0 mx-3">Notification Message</h5>
        <button mat-icon-button class="close-button" (click)="onCancel()">
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <div class="col-md-12 col-12 text-center justify-content-center px-3">
        <mat-form-field appearance="outline" class="w-100 mt-4">
            <mat-label>Notification message</mat-label>
            <textarea matInput rows="5" placeholder="Enter notification message..."
                [formControl]="notificationMsgControl"></textarea>
        </mat-form-field>

        <div class="pb-3 mt-2 d-flex justify-content-center">
            <button class="btn-addd w-100 p-3 mx-3" mat-button
            (click)="onSubmit('Disable')">Disable</button>
            <button class="btn-addd p-3 w-100 mx-3" mat-button
                (click)="onSubmit('AddUpdate')">Submit</button>
        </div>
    </div>
</div>
