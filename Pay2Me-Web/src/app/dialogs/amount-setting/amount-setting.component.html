<div class="dimention p-2">
    <div class="d-flex align-items-center justify-content-between">
        <h5 class="text-center mb-0 mx-3">Minimum and Maximum Amount</h5>
        <button mat-icon-button class="close-button" (click)="onCancel()">
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <div class="col-md-12 col-12 text-center justify-content-center">
        <form role="form" [formGroup]="formGroup" autocomplete="off" novalidate class="mt-4 mx-3">
            <app-input [cssClass]="'w-100'" [isRequired]="true"
                [control]="validator.convertToFormControl(formGroup.controls['minValue'])" [isFlotingLabel]="true"
                placeHolder="Minimum amount" [maxLength]="10"></app-input>

            <app-input [cssClass]="'w-100 mt-2'" [isRequired]="true"
                [control]="validator.convertToFormControl(formGroup.controls['maxValue'])"
                [isFlotingLabel]="true" placeHolder="Maximum amount" [maxLength]="10"></app-input>

            <div class="pb-3 mt-2 d-flex justify-content-center">
                <button [disabled]="formGroup.invalid" class="btn-addd w-100 p-3 mx-3" mat-button
                    (click)="onSubmit(formGroup.value, 'RESET')">Reset</button>
                <button [disabled]="formGroup.invalid" class="btn-addd p-3 w-100 mx-3" mat-button
                    (click)="onSubmit(formGroup.value, 'AddUpdate')">Submit</button>
            </div>
        </form>
    </div>
</div>
