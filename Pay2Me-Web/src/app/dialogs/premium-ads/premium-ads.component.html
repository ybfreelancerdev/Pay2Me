<div class="dimention p-2">
    <div class="d-flex align-items-center justify-content-between">
        <h5 class="text-center mb-0 mx-3">Premium ads</h5>
        <button mat-icon-button class="close-button" (click)="onCancel()">
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <div class="col-md-12 col-12 p-4 justify-content-center">
        <div class="mb-3 w-100 text-center">
            <span class="pngNote">Note: <span class="pngNote2">Please add only gif image only.</span></span>
        </div>
        <input type="file" #selectFile (change)="onFileSelect($event)" accept="image/gif" hidden="true">
        <div class="mb-3">
            <div class="dropzone w-100">
                <div class="text-wrapper">
                    <div class="centered">
                         Drag and drop file or 
                         <a class="browse-button" (click)="selectFile.click()">browse</a>
                          a file* 
                    </div>
                </div>
            </div>
            <div class="text-center" *ngIf="imageData">
                <img style="height: 100px; min-width: 100px; margin-top: 20px;"
                    [src]="imageData" />
                <div style="margin-top: 10px;" class="d-flex justify-content-center align-items-center">
                    <p class="mb-0">{{imageName}}</p>
                    <app-button [color]="'primary'" [cssClass]="'mx-3'" [btntype]="'mini-fab'" [icon]="'delete'" (onClickEvent)="onDelete()">
                    </app-button>
                </div>
            </div>
        </div>
        <div class="mt-4 d-flex justify-content-center">
            <button class="btn-addd p-2 w-50 mx-3" mat-button
                (click)="onSubmit('AddUpdate')">Submit</button>
        </div>
    </div>
</div>
