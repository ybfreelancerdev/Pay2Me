<main class="main-content  mt-0">
    <div class="page-header align-items-start min-vh-100" style="background-image: linear-gradient(#861f41, #ffffff);">
        <span class="mask opacity-6"></span>
        <div class="container my-auto">
            <div class="row">
                <div class="col-lg-6 col-md-8 col-12 mx-auto">
                    <div class="card z-index-0 fadeIn3 fadeInBottom">
                        <div class="card-body mt-1 mb-1">
                            <div class="row">
                                <div class="col-md-12">
                                    <h1 class="text-center font-weight-bold">404 ERROR</h1>
                                    <h5 class="text-center">
                                        Looks like the page you were looking for is no longer here. But you can click the button below to go back to the homepage.
                                    </h5>
                                    <div class="text-center mt-4">
                                        <app-button [color]="'primary'" [cssClass]="'w-30 p-1'"
                                            [text]="'Back To Login'"
                                            (onClickEvent)="router.navigate([appModuleInterface.loginPath])">
                                        </app-button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
